[toolchain]
# Pinned, not `stable`. The pinned `ruff_*@0.0.6` crates declare `rust-version = "1.95"`, so on the
# machine's `stable` (1.87.0) `cargo build` aborts before compiling a single line of our code:
#   error: rustc 1.87.0 is not supported by the following packages:
#     ruff_python_ast@0.0.6 requires rustc 1.95
# 1.97.0 is exactly what ruff itself pins in its own `rust-toolchain.toml` at
# a2635fd8f39e1d34ce8074cb486809426148f3e9 (tag 0.16.0) — the commit our `ruff_python_parser 0.0.6`
# was published from. Solving this with `rustup update stable` instead would leave the toolchain
# version outside the repository, so a fresh clone and CI could drift apart silently.
channel = "1.97.0"
# So `make rust.lint` / `make rust.fmt` / `make rust.cov` work on a fresh clone without a manual
# `rustup component add`. `llvm-tools` is what `cargo llvm-cov` shells out to (llvm-profdata,
# llvm-cov); it is available for this pinned version — `rustup component list --toolchain 1.97.0`
# offers `llvm-tools-aarch64-apple-darwin`, so pinning it here does not force the toolchain off 1.97.0.
#
# It is in the shared toolchain file rather than a step in the coverage job alone, which means the
# other three cargo jobs download it too and do not use it. That is the accepted price: a component
# listed here is installed by rustup on the first `cargo` call, so `make rust.cov` works identically
# on a fresh clone and on a runner, with nothing to keep in sync between the two.
#
# The component is only half the requirement. `cargo llvm-cov` is a separate cargo subcommand
# crate and is NOT installed by this file — see CONTRIBUTING.md.
components = ["clippy", "rustfmt", "llvm-tools"]
