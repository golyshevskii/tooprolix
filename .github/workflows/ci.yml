name: CI

# Least-privilege GITHUB_TOKEN: every job here only reads the checked-out code.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

# Key on the ref so a re-push cancels the stale run instead of racing it.
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corpus/measure.py hard-exits below CPython 3.12 (pre-PEP-701 tokenize hides
  # identifiers inside f-strings), so the gates must run on 3.12+. Pinned
  # explicitly rather than relying on the runner default or requires-python.
  PYTHON_VERSION: "3.12"
  # Fail if uv.lock is stale relative to pyproject.toml instead of silently
  # re-resolving it. Verified locally with `UV_LOCKED=1 make <target>` for all
  # three targets (see task report) before enabling here.
  UV_LOCKED: "1"
  # Cargo hygiene for CI, shared by every job below that runs cargo. Incremental
  # compilation is pure overhead on a cold runner; the retries stop a flaky
  # crates.io from reading as a code failure.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "10"

jobs:
  # Eight jobs: three Python (lint/type/test), four Rust (cargo-fmt,
  # cargo-clippy, cargo-test, cargo-doc) and coverage.
  #
  # Keep this count honest. It read "Six jobs" while there were seven — the
  # `coverage` job was added without updating it — and then eight when
  # `cargo-doc` landed. It briefly read "Nine" for a `pr-title` job that now
  # lives in `.github/workflows/release-contract.yml` instead, because that
  # gate needs a `pull_request: types: [… edited]` trigger and putting it on
  # this shared one would re-run all eight jobs on every description typo. A
  # comment that miscounts the file it sits in is the cheapest possible thing
  # to get wrong and the easiest to believe.
  #
  # The Rust jobs are deliberately NOT named `test`/`lint` — those names are
  # already taken by the Python jobs above and are registered as required
  # status checks in branch protection. Renaming any existing job silently
  # breaks that rule: the old name stays required and never reports again.
  #
  # No `paths:`, `paths-ignore:` or `if:` on ANY job in this file. A SKIPPED
  # check does not satisfy a required status check — it stays pending, so a
  # path-filtered gate wedges a PR at "Expected — waiting for status to be
  # reported" while CI is entirely green. ruff does gate its cargo jobs on a
  # `determine_changes` job; that practice is NOT portable here, because ruff's
  # required checks are configured differently.
  #
  # AC4's corpus-determinism proof (`make corpus.measure`) deliberately does
  # NOT run here: it clones the whole pinned corpus, which is hundreds of
  # megabytes and minutes of network on every run. That check stays a local,
  # manual step; do not "fix" CI by adding it.

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: make lint.check
        run: make lint.check

  type:
    name: type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: make type
        run: make type

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, and ONLY this job needs it. The classification artifacts of the
          # anti-false-positive gate name the commit each measurement was taken on, and
          # `corpus/classification.py` resolves that commit with `git cat-file` rather than trusting
          # the string — AC9's whole point is that a provenance nobody can check is not one. Under
          # the default shallow checkout that lookup fails on a commit that genuinely exists, and
          # 20 tests go red for an environment reason:
          #
          #   detector_commit '6242f30…' does not resolve to a commit in /home/runner/work/…
          #
          # Deliberately NOT fixed by letting the check pass when the repository is shallow. That
          # would be a guard that fails open, disabled by the checkout depth of whoever runs it,
          # and this gate has already had two review findings of exactly that shape.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: make test
        run: make test

  # ---------------------------------------------------------------------------
  # Rust gates. The toolchain is NOT chosen here: rust-toolchain.toml pins
  # 1.97.0 plus the clippy/rustfmt components, and rustup honours it on first
  # `cargo` invocation. The pinned ruff_* crates require rustc >= 1.95, so a
  # runner default of `stable` is not guaranteed to be enough.
  # ---------------------------------------------------------------------------

  cargo-fmt:
    name: cargo-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No rust-cache here on purpose: rustfmt parses the source and builds no
      # dependencies, so there is nothing worth caching.
      - name: Show the pinned toolchain
        run: rustup show

      - name: make rust.fmt.check
        run: make rust.fmt.check

  cargo-clippy:
    name: cargo-clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Make `uv python find` (used by `make rust.lint`) resolve ONLY a uv-managed CPython, never a
      # system one the runner image happens to provide. Deliberate over incidental.
      UV_MANAGED_PYTHON: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # `make rust.lint` resolves the interpreter with `uv python find`; this step is what guarantees
      # there is one to find. The action's `python-version` input only sets UV_PYTHON (its README says
      # so) and installs nothing, so without this the lookup would fall back to whatever the runner
      # image happens to ship. UV_MANAGED_PYTHON then pins it to the uv-managed build.
      - name: Install a managed Python for the pyo3 build script
        run: uv python install "${PYTHON_VERSION}"

      - name: Show the pinned toolchain
        run: rustup show

      # v2.9.1 — SHA verified against the source repo, not copied on trust:
      # `git/ref/tags/v2.9.1` -> tag 23869a5b -> commit c1937114.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Only `main` writes the cache, so parallel PRs read a stable entry
          # instead of each saving a near-duplicate one.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: make rust.lint
        run: make rust.lint

      # `make rust.lint` and `make rust.test` both carry `--features python`, so without this step
      # NOTHING in CI compiles the crate with the feature OFF — which is the configuration the
      # standalone binary of AC1 is built in. A `use pyo3::…` that escaped the `#[cfg]` would then
      # break `cargo build` for every consumer while all eight checks stayed green. It rides in this
      # job rather than a new one because a new job would be a new required status check.
      - name: make rust.build.nopython
        run: make rust.build.nopython

  cargo-test:
    name: cargo-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_MANAGED_PYTHON: "1"
      # An insta snapshot that is NEW or CHANGED must FAIL this job, never be written. This is the
      # setting rust-skills `test-snapshot-testing` names for CI. Verified by deleting a committed
      # `.snap` and re-running: with it, `make rust.test` fails with "snapshot assertion for
      # 'extracts_the_python_fixture' failed"; without it insta stores a `.snap.new` beside the
      # source, which is one `git add .` away from an unreviewed snapshot committed as intent.
      INSTA_UPDATE: "no"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # Same reason as in cargo-clippy, and it matters more here: `cargo test` builds a test binary
      # that both LINKS and then LOADS libpython (maturin adds pyo3's `extension-module` feature only
      # for the wheel), so the interpreter must exist, must carry a shared library, and must still be
      # findable by the dynamic loader when the test binary runs. The uv-managed build satisfies all
      # three; `build.rs` is what supplies the third by putting its lib dir on the binary's RUNPATH.
      #
      # This combination is what makes the job independent of the runner image, and that is measured,
      # not assumed: in `rust:1.97` with NO system libpython at all (`ldconfig -p | grep -c
      # libpython3.12.so.1.0` -> 0) `make rust.test` exits 0. Delete `build.rs` and the same container
      # fails at exit 127 with "error while loading shared libraries: libpython3.12.so.1.0", which is
      # how a green `ubuntu-latest` used to be hiding a dependency on the image's python3-dev.
      - name: Install a managed Python for the pyo3 build script
        run: uv python install "${PYTHON_VERSION}"

      - name: Show the pinned toolchain
        run: rustup show

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: make rust.test
        run: make rust.test

  # The rustdoc gate. NEW in the /rust-skills audit: before it, `.github/workflows/ci.yml` contained
  # zero mentions of `cargo doc`/`rustdoc`, and `cargo doc` exits 0 on a broken intra-doc link — so
  # `main` at 962678d carried 5 rustdoc diagnostics with all seven jobs green. One of them
  # (`[`render_failures`]` in the rustdoc of `python_files`) named a function that exists nowhere in
  # `src/`; it had been renamed and the doc was never followed.
  #
  # It is its OWN job rather than a step inside cargo-clippy, which is the opposite of the choice
  # `make rust.build.nopython` made. The reason that choice was made there — "a new job would be a
  # new required status check" — is not true of this repository today: it is private without GitHub
  # Pro, so `branches/main/protection` is 404 and no check is required at all. A separate job is
  # therefore free right now, and it is the shape task #14 will want once protection exists, because
  # a rustdoc failure and a clippy failure are different answers and should not share a red X.
  #
  # No `paths:` and no `if:`, like every other job in this file: a SKIPPED check does not satisfy a
  # required status check, so a filter added today wedges the PR on the day protection is enabled.
  #
  # It needs a managed Python for exactly the reason cargo-clippy does — `make rust.doc` carries
  # `--features python`, so the build script for pyo3-ffi runs and must find an interpreter.
  # Without it the run dies inside pyo3-ffi before rustdoc emits a single diagnostic, which would be
  # a gate that fails for the wrong reason rather than a gate that passes.
  cargo-doc:
    name: cargo-doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_MANAGED_PYTHON: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install a managed Python for the pyo3 build script
        run: uv python install "${PYTHON_VERSION}"

      - name: Show the pinned toolchain
        run: rustup show

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: make rust.doc
        run: make rust.doc

  # There are no coverage badges and nothing here to diff, so what this job protects is the
  # INSTRUMENT rather than a number: it is the only place proving that the coverage toolchain still
  # resolves on Linux — the `llvm-tools` component from rust-toolchain.toml and the pinned
  # `cargo-llvm-cov` install — and that `scripts/coverage_report.py` still accepts a real report
  # from both tools. Tasks 9-11 audit against those figures, and a rotted instrument would only be
  # discovered once an audit was already running.
  #
  # NOT a required status check, deliberately: it protects a measuring tool, not the shipped
  # artifact. It still carries no `paths:` and no `if:` — a SKIPPED check does not satisfy a
  # required one, so a path filter added today would wedge the PR on the day it is registered.
  #
  # It re-runs the Rust tests under instrumentation and the Python tests under coverage, so it is
  # the slowest job here.
  #
  # ⚠️ It is NOT a repeat of the whole `cargo-test` job: `cargo llvm-cov` does not run doctests
  # without `--doctests`, which needs a nightly toolchain, so this job instruments 188 of the 194
  # tests `make rust.test` runs. `cargo-test` above remains the only job that executes the 6
  # doctests. Written down in the Makefile's coverage block too, next to the other exclusions.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_MANAGED_PYTHON: "1"
      INSTA_UPDATE: "no"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # Same reason as in cargo-test: `make rust.cov` runs the test binaries, which link and load
      # libpython.
      - name: Install a managed Python for the pyo3 build script
        run: uv python install "${PYTHON_VERSION}"

      # `llvm-tools` comes from rust-toolchain.toml, so this also proves the pin resolves.
      - name: Show the pinned toolchain
        run: rustup show

      # The cargo SUBCOMMAND, which is not a rustup component and so is not in
      # rust-toolchain.toml. A prebuilt binary from the tool's own maintainer, rather than
      # `cargo install cargo-llvm-cov` compiling it from source on every run (minutes, every job).
      #
      # v2.85.3 — SHA verified against the source repo rather than copied on trust:
      # `git/ref/tags/v2.85.3` -> commit 18b1216e. Same practice as the rust-cache pin above.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: make cov
        run: make cov
