name: CI

# Least-privilege GITHUB_TOKEN: every job here only reads the checked-out code.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
    # THE TAG IS WHAT GETS PUBLISHED, SO THE TAG IS WHAT HAS TO BE TESTED.
    #
    # Measured at `eb65e32`: five tags, five workflow runs, every one of them `Build artifacts`.
    # Zero lint/type/test/cargo runs on any tag, ever — publication would have uploaded a binary
    # from a tree no ordinary gate had seen.
    #
    # The release PR's own CI is NOT a substitute, and that is measured too: on `pull_request`,
    # `actions/checkout` materialises `refs/pull/N/merge`. For `v0.4.6` that was tree `3a1f67fd`
    # while the tag's tree was `5d0ceefb`. Two different trees, one green tick.
    #
    # `branches: [main]` stays. Branch protection is absent (`branches/main/protection` -> 404,
    # rulesets -> 403 on a Free private repository), so nothing stops a direct push to `main` and
    # post-merge CI is the only thing that would notice one. Removing it is a separate change, gated
    # on a 200 from the protection API and a demonstrated direct-push refusal.
    tags: ['v*']

# Key on the ref so a re-push cancels the stale run instead of racing it.
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The interpreter corpus/REPORT.md's constants were measured on, and above the
  # 3.12 corpus floor so `requires-python`'s open upper bound is really exercised.
  # Enforced by test_ci_runs_above_the_corpus_floor... in tests/unit/test_measure.py.
  PYTHON_VERSION: "3.14"
  # Fail if uv.lock is stale relative to pyproject.toml instead of silently
  # re-resolving it. Verified locally with `UV_LOCKED=1 make <target>` for all
  # three targets (see task report) before enabling here.
  UV_LOCKED: "1"
  # Cargo hygiene for CI, shared by every job below that runs cargo. Incremental
  # compilation is pure overhead on a cold runner; the retries stop a flaky
  # crates.io from reading as a code failure.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "10"

jobs:
  # FIVE JOBS: `ci-python`, `ci-rust`, `cargo-doc`, `coverage`, and the `ci-required` aggregate.
  #
  # Keep this count honest. This comment has miscounted the file it sits in three times — "Six" at
  # seven jobs, "eight" after `cargo-doc` landed, and briefly "Nine" for a `pr-title` job that now
  # lives in `.github/workflows/release-contract.yml` instead, because that gate needs a
  # `pull_request: types: [… edited]` trigger and putting it on this shared one would re-run
  # everything on every description typo. A comment that miscounts the file it sits in is the
  # cheapest possible thing to get wrong and the easiest to believe.
  #
  # WHY FIVE AND NOT EIGHT. `lint`/`type`/`test` became `ci-python`, and
  # `cargo-fmt`/`cargo-clippy`/`cargo-test` became `ci-rust`. GitHub bills each JOB rounded up to
  # the whole minute, so eight sub-minute jobs cost 10 billed minutes for 269 s of real work
  # (PR #46, run 30690967366) and 59 % of that raw time was per-job setup — `Show the pinned
  # toolchain` alone ran four times. A hypothesis that the four Rust jobs duplicated a COMPILE was
  # falsified and must not be re-introduced as justification: a Rust-heavy PR cost 256 s,
  # indistinguishable from a README-only one, because `Swatinem/rust-cache` already absorbs it.
  # The win is rounding and setup, not compilation.
  #
  # WHAT DID NOT MERGE, and why each refusal is deliberate:
  #   * `cargo-doc` — a rustdoc failure and a clippy failure are different answers and must not
  #     share one red X. Decided by the user on 2026-08-01, not assumed by the implementer.
  #   * `coverage` — distinct contract (it protects the instrument, not a number), distinct
  #     toolchain (`cargo-llvm-cov` + `llvm-tools`), and it is the slowest job here; folding it in
  #     would push `ci-rust` up a rounded minute for nothing.
  #   * `release-contract` — a different workflow on a `pull_request_target` trigger with a
  #     different permission scope. `needs:` cannot cross workflow boundaries, so the aggregate
  #     below cannot absorb it and it stays separately reportable.
  #
  # The accepted cost of consolidation, stated rather than discovered later: steps inside one job
  # are sequential and fail fast, so a `rustfmt` failure now hides the clippy and test results that
  # eight jobs would have reported in parallel. That is the trade the billing measurement bought.
  #
  # The Rust job is deliberately NOT named `test`/`lint` — renaming a check that branch protection
  # has registered silently breaks it: the old name stays required and never reports again. Nothing
  # is required today (`branches/main/protection` -> 404), which is exactly why the renaming and the
  # aggregate happen NOW, while it is free.
  #
  # No `paths:`, `paths-ignore:` or `if:` on any WORK job in this file. A SKIPPED check does not
  # satisfy a required status check — it stays pending, so a path-filtered gate wedges a PR at
  # "Expected — waiting for status to be reported" while CI is entirely green. ruff does gate its
  # cargo jobs on a `determine_changes` job; that practice is NOT portable here, because ruff's
  # required checks are configured differently.
  #
  # The ONE `if:` in this file is `ci-required`'s `always()`, and it is the opposite of a filter: it
  # can only make the aggregate run more often, never less. A path classifier that would need real
  # job conditions was DEFERRED on 2026-08-01 (`route-ci-jobs-by-changed-paths`) — its whole measured
  # saving is the 29 minutes the `wheels` event gate in `build-artifacts.yml` already takes, and its
  # defect surface is real: a rule of the shape `scripts/** -> artifact stages` routes
  # `scripts/coverage_report.py`, run only by `Makefile:254`/`:265`, away from the `coverage` job
  # that is its only consumer, and the path is *recognised*, so no catch-all ever fires.
  #
  # AC4's corpus-determinism proof (`make corpus.measure`) deliberately does NOT run here: it clones
  # the whole pinned corpus, which is hundreds of megabytes and minutes of network on every run.
  # That check stays a local, manual step; do not "fix" CI by adding it.

  ci-python:
    name: ci-python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checked_out_sha: ${{ steps.checked-out.outputs.checked_out_sha }}
      checked_out_tree: ${{ steps.checked-out.outputs.checked_out_tree }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history. The classification artifacts of the anti-false-positive gate name the
          # commit each measurement was taken on, and `corpus/classification.py` resolves that
          # commit with `git cat-file` rather than trusting the string — AC9's whole point is that a
          # provenance nobody can check is not one. Under the default shallow checkout that lookup
          # fails on a commit that genuinely exists, and a block of tests goes red for an
          # environment reason. Reproduced locally on 2026-08-01 with `git clone --depth 1` plus
          # `make test`: **16 failed, 317 passed**, every failure the same message. It was 20 when
          # the defect was first found; the count drifts with the test suite and is not the point.
          #
          #   detector_commit '6242f30…' does not resolve to a commit in /home/runner/work/…
          #
          # Deliberately NOT fixed by letting the check pass when the repository is shallow. That
          # would be a guard that fails open, disabled by the checkout depth of whoever runs it, and
          # this gate has already had two review findings of exactly that shape.
          #
          # EVERY job that runs the Python tests needs this, not just this one. `coverage` runs them
          # too, through `make cov` -> `py.cov`, and it went red for the identical reason after this
          # job was fixed alone. Enforced by
          # test_every_job_that_runs_the_python_tests_checks_out_the_full_history, which asks which
          # jobs run them instead of naming the jobs.
          fetch-depth: 0

      # WHAT WAS REALLY MATERIALISED, EMITTED BY THE JOB THAT THEN GRADES IT.
      #
      # A run's `head_sha` is a label the run reports ABOUT ITSELF. Measured: run 30691798694
      # reports `head_sha=292d8af4` while `actions/checkout` materialised tree `3a1f67fd`. A
      # workflow triggered at tag `T` but checking out `main` yields `head_sha=T`, `name=CI`,
      # `conclusion=success`, and a publish precondition reading that field passes over a tag no
      # ordinary CI ever exercised.
      #
      # `git rev-parse` here reads the real working tree at the moment the gates below run, so it is
      # the artifact rather than the story about it. THE RESIDUAL, named rather than left for a
      # reader to assume closed: this is still produced by the job being graded — a workflow could
      # test one tree and then emit another. What bounds that is the workflow definition itself,
      # which is tracked in git and reviewed in a PR; `head_sha` is not a reviewable object at all.
      # The named upgrade path is "test and build once, then publish that exact attested digest",
      # which belongs to the publication task.
      #
      # Both a job output (so a later job can consume it) and a log line (so a human reading the run
      # can see it without the API).
      - name: Record what was actually checked out
        id: checked-out
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse "HEAD^{tree}")
          echo "checked_out_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "checked_out_tree=$tree" >> "$GITHUB_OUTPUT"
          echo "checked out commit $sha, tree $tree"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: make lint.check
        run: make lint.check

      - name: make type
        run: make type

      - name: make test
        run: make test

  # ---------------------------------------------------------------------------
  # The Rust gates. The toolchain is NOT chosen here: rust-toolchain.toml pins
  # 1.97.0 plus the clippy/rustfmt components, and rustup honours it on first
  # `cargo` invocation. The pinned ruff_* crates require rustc >= 1.95, so a
  # runner default of `stable` is not guaranteed to be enough.
  # ---------------------------------------------------------------------------

  ci-rust:
    name: ci-rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # An insta snapshot that is NEW or CHANGED must FAIL this job, never be written. This is the
      # setting rust-skills `test-snapshot-testing` names for CI. Verified by deleting a committed
      # `.snap` and re-running: with it, `make rust.test` fails with "snapshot assertion for
      # 'extracts_the_python_fixture' failed"; without it insta stores a `.snap.new` beside the
      # source, which is one `git add .` away from an unreviewed snapshot committed as intent.
      INSTA_UPDATE: "no"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # KEEP THIS. It was deleted with the pyo3 boundary and the Rust test job went red on PR #34 —
      # `uv run python3 is available in this environment: Os { code: 2, kind: NotFound }`.
      #
      # The deletion was reasoned from the build: with pyo3 gone nothing here *compiles* against an
      # interpreter, which is true. But two TESTS shell out to `uv`, for reasons that have nothing
      # to do with pyo3 and predate that task:
      #
      #   * `tests/cli.rs` runs `uv run python3` to prove the `schema_version: "2"` JSON document is
      #     genuinely consumable by a Python consumer — the whole point of the schema bump in
      #     `make-check-graceful-on-unreadable-files`;
      #   * `tests/ruff_compatibility.rs` runs `uv run --only-group lint ruff` to prove the
      #     `# !TPX00N` marker grammar stays invisible to ruff. It carries no `#[ignore]`; on PR #34
      #     it simply never ran, because the run aborted at `tests/cli.rs` first.
      #
      # The measurement that settles it, from this same workflow: `coverage` kept its `uv` and
      # stayed GREEN while running the identical tests through `cargo llvm-cov`. Two jobs, same
      # tests, one difference. So the rule is **"does anything this job EXECUTES shell out to
      # `uv`?"**, not "does anything it builds need an interpreter?" — `git grep 'Command::new("uv")'`
      # is the check, it returns two hits, and both are executed here.
      #
      # `cargo-doc` below is correctly WITHOUT uv: it documents, it runs no tests, and `make
      # rust.doc` shells out to nothing. Enforced by
      # test_the_job_that_runs_the_rust_tests_installs_uv, which derives the requirement from the
      # Rust sources instead of from a job name.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Show the pinned toolchain
        run: rustup show

      # v2.9.1 — SHA verified against the source repo, not copied on trust:
      # `git/ref/tags/v2.9.1` -> tag 23869a5b -> commit c1937114.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Only `main` writes the cache, so parallel PRs read a stable entry
          # instead of each saving a near-duplicate one.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Cheapest first: rustfmt only parses the source and builds no dependencies. It used to be its
      # own cache-less job for that reason, and folding it in costs nothing — it reads the cache the
      # steps below need anyway.
      - name: make rust.fmt.check
        run: make rust.fmt.check

      - name: make rust.lint
        run: make rust.lint

      # The linkage guard: it reads the binary cargo just linked and fails on any dynamic dependency
      # naming Python.
      #
      # WHAT IT DOES NOT COVER, said plainly because it is easy to read this as a promise about the
      # shipped wheel: `make rust.build` runs `cargo build --locked` with no `--release`, and this
      # job is `runs-on: ubuntu-latest`. So it grades ONE artifact — a Linux x86_64 DEBUG executable
      # — while `build-artifacts.yml` ships release builds for linux-x86_64, macos-arm64 and
      # windows-x86_64. A linkage that appeared only under `--release`, or only on macOS or Windows,
      # would pass here and still reach a published wheel. What actually exercises the shipped
      # artifacts is `scripts/install-smoke.sh` in `build-artifacts.yml`, which runs each one.
      - name: make rust.build
        run: make rust.build

      - name: make rust.test
        run: make rust.test

  # The rustdoc gate. NEW in the /rust-skills audit: before it, this file contained zero mentions of
  # `cargo doc`/`rustdoc`, and `cargo doc` exits 0 on a broken intra-doc link — so `main` at 962678d
  # carried 5 rustdoc diagnostics with all seven jobs green. One of them (`[`render_failures`]` in
  # the rustdoc of `python_files`) named a function that exists nowhere in `src/`; it had been
  # renamed and the doc was never followed.
  #
  # IT STAYS ITS OWN JOB. That is a recorded user decision of 2026-08-01, taken against the ≈1
  # billed minute merging it into `ci-rust` would save: a rustdoc failure and a clippy failure are
  # different answers and should not share a red X. It IS in `ci-required` below, so it gates a
  # merge exactly as hard as the two work jobs do.
  cargo-doc:
    name: cargo-doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the pinned toolchain
        run: rustup show

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: make rust.doc
        run: make rust.doc

  # There are no coverage badges and nothing here to diff, so what this job protects is the
  # INSTRUMENT rather than a number: it is the only place proving that the coverage toolchain still
  # resolves on Linux — the `llvm-tools` component from rust-toolchain.toml and the pinned
  # `cargo-llvm-cov` install — and that `scripts/coverage_report.py` still accepts a real report
  # from both tools. Later audits work against those figures, and a rotted instrument would only be
  # discovered once an audit was already running.
  #
  # NOT a required status check, deliberately, and that is why it is absent from `ci-required`'s
  # `needs:` below: it protects a measuring tool, not the shipped artifact. It still carries no
  # `paths:` and no `if:` — a SKIPPED check does not satisfy a required one, so a path filter added
  # today would wedge the PR on the day it is registered.
  #
  # It re-runs the Rust tests under instrumentation and the Python tests under coverage, so it is
  # the slowest job here.
  #
  # It is NOT a repeat of `ci-rust`'s test step: `cargo llvm-cov` does not run doctests without
  # `--doctests`, which needs a nightly toolchain, so the `Doc-tests tooprolix` target is absent
  # from this job entirely and `ci-rust` remains the only job that executes it. No count is given
  # here on purpose — nothing enforces one, and the pair of numbers that used to stand here had
  # drifted. Written down in the Makefile's coverage block too, next to the other exclusions.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INSTA_UPDATE: "no"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `make cov` runs `py.cov`, which runs the same Python tests as `ci-python`, so this job
          # needs the same full history for the same reason — see the note on that job above.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # `llvm-tools` comes from rust-toolchain.toml, so this also proves the pin resolves.
      - name: Show the pinned toolchain
        run: rustup show

      # The cargo SUBCOMMAND, which is not a rustup component and so is not in
      # rust-toolchain.toml. A prebuilt binary from the tool's own maintainer, rather than
      # `cargo install cargo-llvm-cov` compiling it from source on every run (minutes, every job).
      #
      # v2.85.3 — SHA verified against the source repo rather than copied on trust:
      # `git/ref/tags/v2.85.3` -> commit 18b1216e. Same practice as the rust-cache pin above.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: make cov
        run: make cov

  # THE ONE CHECK BRANCH PROTECTION WILL BE POINTED AT: `CI / ci-required`.
  #
  # It exists BEFORE protection is enabled, on purpose. GitHub only offers a check that has reported
  # successfully in the preceding seven days, and a required name that stops reporting stays
  # required forever — so the name has to be final and already reporting before anyone can register
  # it. The deferred path classifier reuses this name instead of orphaning one.
  #
  # `if: always()` IS WHAT MAKES IT ABLE TO SEE A FAILURE. Without it, a needed job that ends in
  # anything but success skips this job too, and a skipped check never reports — it wedges a
  # protected PR at "Expected — waiting for status to be reported" instead of going red. That is the
  # inverse of a gate.
  #
  # It grades `result`, which for a needed job is one of success/failure/cancelled/skipped, and only
  # `success` passes. `cancelled` and `skipped` are not success, and reading them as "not failed" is
  # exactly how PR #37's four cancelled artifact checks looked green.
  #
  # AND IT FAILS CLOSED ON AN EMPTY `needs:`. A set-equality check over an empty expectation passes
  # having graded nothing; deleting the `needs:` list would otherwise turn this into a job that
  # reports success unconditionally. The length check is a separate assertion from the result check
  # because a populated-set test cannot prove the empty case.
  #
  # `coverage` is deliberately NOT here: it protects the measuring instrument rather than the
  # shipped artifact and was never a required check. `release-contract` cannot be here — `needs:`
  # does not cross workflow boundaries — and stays separately reportable.
  #
  # Today no work job carries an `if:`, so this aggregate can only be red or green, never vacuous.
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-python, ci-rust, cargo-doc]
    if: always()
    steps:
      - name: Every required job must have concluded success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"

          graded=$(jq 'length' <<<"$RESULTS")
          if [ "$graded" -eq 0 ]; then
            echo "FAIL: this job needed nothing, so it graded nothing." >&2
            exit 1
          fi

          unsuccessful=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$RESULTS")
          if [ -n "$unsuccessful" ]; then
            echo "FAIL: not every required job succeeded: $unsuccessful" >&2
            exit 1
          fi

          echo "OK: $graded required job(s), every one of them success."
