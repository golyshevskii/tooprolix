name: Build artifacts

# THERE IS NO PUBLISH STEP IN THIS FILE, AND THAT IS THE POINT OF IT.
#
# This is the reversible half of publication: it builds every artifact the
# supported matrix promises, installs each one and runs it, and uploads the results as run
# artifacts. Nothing is uploaded to PyPI, TestPyPI or crates.io and no tag is created.
#
# Stated precisely, because the publishing task inherits this reasoning: a credential IS
# provisioned. `permissions: contents: read` gives the job a read-scoped `GITHUB_TOKEN`, and
# `actions/checkout` reads it to clone — `persist-credentials: false` only keeps it out of
# `.git/config` afterwards, it does not stop the checkout step receiving it. What is absent is
# anything that could PUBLISH: no `secrets.*` is referenced anywhere in this file, no scope here is
# writable, and there is no `id-token`, so no OIDC exchange is available to a step that tried. The
# publishing task owns the irreversible half and will add a publish job of its own.
#
# # Two axes, decided separately: the BRANCH axis is filtered, the PATH axis is not
#
# `workflow_dispatch` alone is not enough: GitHub reads the dispatch definition from the default
# branch, so on a feature branch that adds this file manual dispatch is not available at all.
#
# THE BRANCH AXIS IS NARROWED TO `main`, `v*` AND PULL REQUESTS, and that is a change from the bare
# `push:` this file used to carry. Measured over the `v0.4.6` cycle: **six** full artifact matrices,
# of which at most two were load-bearing — roughly 204 of the cycle's 226 billed minutes rebuilding
# trees that were already built or were never released. The cause is the branch axis, not the path
# axis: GitHub delivers a branch-CREATION push for every release-plz branch, so the base tip is
# rebuilt before the release commit even exists, and then again on the next release-pr run.
#
# `pull_request` is the deliberate preflight, and what it grades is named rather than assumed: it
# checks out `refs/pull/N/merge`, i.e. the MERGE tree, which is what `ci.yml` tests and NOT
# necessarily the tree that gets tagged (for `v0.4.6` those were `3a1f67f` and `5d0ceef`). The
# authoritative full matrix is the one on the `v*` tag; the release-plz PR is the earlier warning.
# The alternative — `push: branches: ['release-plz-**']`, which would grade the release-commit tree
# — was rejected because a `push:` branch pattern also matches the branch-CREATION event, so it
# re-creates the exact duplicate this filter exists to delete.
#
# THE `paths:` FILTER WAS REMOVED, AND ITS REMOVAL IS THE FIX. It listed five files —
# `Cargo.toml`, `pyproject.toml`, this workflow, and the two scripts — under a header claiming those
# five "decide what an artifact contains". They do not: `README.md` is the description PyPI renders,
# `build.rs` decides the date, `src/**` and `Cargo.lock` are the binary, `LICENSE` and `docs/**` ride
# in the archives. A README-only change — **precisely the change that breaks the transformer** —
# skipped this workflow entirely, so not one of its checks could go red on it.
#
# Replacing the list with a longer list would only move the boundary: the next file nobody thought
# of has the same effect, and the list rots silently because nothing tells you it is short. An
# unfiltered trigger cannot be wrong about what matters. The cost is named rather than hidden: four
# more jobs per push, roughly doubling the compile work `ci.yml` already does. Buy the filter back
# only with a measurement showing that cost is real.
#
# # The supported matrix, and why it is three platforms rather than seventeen
#
# `linux x86_64`, `macOS arm64`, `Windows x86_64`, plus an sdist for everything else (Decisions
# #19.3). All three run natively on free hosted runners, so **every published wheel is smoke-tested
# on the operating system it claims**. Our reference, ruff, publishes 17 wheels of which 5 have no
# install-smoke at all — its `macos-x86_64` job has no `Test` step whatsoever — and that is the
# reason its width is deliberately NOT copied. Linux aarch64 and macOS x86_64 would mean QEMU or an
# untested wheel; neither is taken on speculation.
#
# # The floor of each platform is DECLARED, not inherited from the runner
#
# A wheel that builds on the newest runner and is tagged for the oldest OS its platform tag names
# fails at the user's dynamic loader, which is the one failure no gate here would otherwise see:
#
#   * linux   — `manylinux: 2_17`, i.e. glibc >= 2.17 (CentOS 7 / Ubuntu 14.04). The tag the wheel
#     carries is checked below rather than assumed.
#   * macOS   — `MACOSX_DEPLOYMENT_TARGET: "11.0"`. maturin defaults to exactly this for
#     aarch64-apple-darwin (observed in its own output) and 11.0 is also the first macOS with Apple
#     silicon, so nothing older can run an arm64 build anyway. It is written down because a default
#     is not a promise.
#   * windows — x86_64-pc-windows-msvc. There is no deployment-target knob; the floor is whatever
#     the MSVC runtime the toolchain links against supports, which is Windows 10 for the pinned
#     Rust. Said out loud rather than left blank.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Keyed on the COMMIT, not the ref. One logical event used to deliver two pushes to one new ref
# seconds apart — release-plz creates the branch at the base tip and pushes the release commit.
# Keyed on the ref, the later run cancels the earlier one, and on PR #37 that killed the release
# commit's build while the base tip's survived.
#
# The branch filter above now stops those release-branch pushes reaching this workflow at all, so
# the event that armed PR #37's race no longer fires. THIS KEY STILL DOES NOT GO BACK TO
# `github.ref`: keying on the commit is correct independently of which events are accepted — it
# costs nothing, it still collapses duplicate events for one SHA (all `cancel-in-progress` was ever
# wanted for), and reverting it would silently re-arm the race the day the trigger widens again.
# Enforced by test_an_artifact_build_is_only_cancelled_by... in tests/unit/test_workflow_contracts.py.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  # The distribution floor, so every install-smoke below exercises the lowest interpreter
  # `requires-python` promises. Not a matrix: the wheel is `py3-none-<platform>`, so only the
  # installing interpreter is worth moving.
  PYTHON_VERSION: "3.11"
  # Pinned, exactly as ruff pins it. maturin decides the wheel tag and the archive layout, so an
  # unpinned "latest" would let the shape of the published artifact change without a commit here.
  MATURIN_VERSION: v1.14.1
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "10"

jobs:
  sdist:
    name: sdist (+ the wheel built from it)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # THE ONLY WAY A RELEASE ARTIFACT LEARNS WHAT IT WAS BUILT FROM.
      #
      # `tooprolix --version` prints the COMMIT date, resolved by build.rs as SOURCE_DATE_EPOCH ->
      # git -> `unknown`. An sdist carries no `.git`, and since `add-version-and-rules-commands` it
      # will not borrow a surrounding repository's either — so without this line the wheel built
      # from the sdist below prints `tooprolix 0.4.1 (unknown)`. Measured, not predicted: that is
      # exactly what it printed, and it passed every other assertion in the smoke.
      #
      # `>> "$GITHUB_ENV"` so it reaches the maturin steps, which run in their own shells.
      - name: Export SOURCE_DATE_EPOCH from the commit
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "commit date: $(git log -1 --format=%cs)"

      # Before maturin reads `readme = "README.md"`. The script rewrites EVERY relative address
      # into an absolute GitHub URL and FAILS THE BUILD if the README is not the shape it expects —
      # `twine check` validates the METADATA envelope and never the links inside the description.
      - name: Rewrite the README for the PyPI project page
        run: uv run --no-project --with 'readme_renderer[md]' python scripts/transform_readme.py README.md

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist

      # AC1: the sdist must be self-sufficient. A wheel built from the unpacked tarball, in a
      # directory with no `.git` and no repository around it, is the only honest test of that — a
      # `cargo package --list` shows what is inside but not whether it builds.
      #
      # THE WHEEL THIS STEP PRODUCES IS EVIDENCE, NOT A PUBLISHABLE ARTIFACT, and its own tag says
      # so: measured in run 30605245528 it came out `py3-none-manylinux_2_34_x86_64`, because it is
      # built directly on the runner rather than in the manylinux 2_17 container the matrix leg uses.
      # glibc 2.34 is a far higher floor than the one this project promises. It lives in
      # `dist-from-sdist/` and never in `dist/` for exactly that reason. Whoever adds the publish job
      # uploads `dist/` and the matrix artifacts — never this one.
      - name: Build a wheel FROM the sdist
        run: |
          set -euo pipefail
          mkdir -p from-sdist && tar xzf dist/tooprolix-*.tar.gz -C from-sdist
          test ! -e from-sdist/tooprolix-*/.git
          uvx "maturin==${MATURIN_VERSION#v}" build --release --locked \
            --manifest-path from-sdist/tooprolix-*/Cargo.toml \
            --out dist-from-sdist --compatibility pypi

      # EXACTLY ONE FILE PER DIRECTORY, OR THIS FAILS. `$(echo dist/*.whl)` looks like "the
      # wheel" and is really a space-joined list: run 30604813542 had a stray wheel in `dist/` and
      # handed uv `<macos wheel> <linux wheel>` as one path, which then failed with a URL-encoded
      # space in it. That is a guard failing open — the step before it had already "passed" on the
      # same two-file string, because `basename` on it returns the last one. Counting first is what
      # makes the later steps grade one named artifact instead of whatever the glob swept up.
      - name: Resolve the artifacts, exactly one of each
        run: |
          set -euo pipefail
          for pair in "SDIST:dist/*.tar.gz" "WHEEL_FROM_SDIST:dist-from-sdist/*.whl"; do
            name="${pair%%:*}"
            # shellcheck disable=SC2206
            found=(${pair#*:})
            if [ "${#found[@]}" -ne 1 ] || [ ! -f "${found[0]}" ]; then
              echo "FAIL: expected exactly one ${pair#*:}, found ${#found[@]}: ${found[*]}" >&2
              exit 1
            fi
            echo "$name=${found[0]}" >> "$GITHUB_ENV"
            echo "$name = ${found[0]}"
          done

      - name: twine check
        run: uvx twine check --strict "$SDIST" "$WHEEL_FROM_SDIST"

      # AC3 AND AC8, GATED IN CODE RATHER THAN OBSERVED IN A REPORT. `twine check --strict`
      # validates the METADATA envelope and the description's markup; it never asks what the licence
      # says, whether a LICENSE file is actually in the archive, whether the sdist carries the two
      # documents the README links to, or which file the shipped description came from. All three
      # exploits were measured green under every other gate here — see the script's own header.
      #
      # README.md on disk is the TRANSFORMED one at this point, which is the object AC8 names.
      - name: The archives carry MIT, their LICENSE, docs/, and the transformed README
        run: |
          uv run --no-project python scripts/check_artifact.py "$SDIST" README.md
          uv run --no-project python scripts/check_artifact.py "$WHEEL_FROM_SDIST" README.md

      # AC4 for the source path, with an ORACLE rather than a shape check: the expected date is
      # `git log -1 --format=%cs`, computed here from the checkout, so a binary built from any other
      # commit fails. Without it the smoke accepted `tooprolix 0.4.1 (2000-01-01)` — measured.
      - name: install-smoke the wheel built from the sdist
        run: scripts/install-smoke.sh "$WHEEL_FROM_SDIST" "$(git log -1 --format=%cs)"

      # THE NON-CIRCULAR HALF, AND IT PINS AN ACCEPTED LIMITATION RATHER THAN HIDING ONE.
      #
      # Every other step here runs with SOURCE_DATE_EPOCH exported, so "the sdist produces a dated
      # binary" was only ever proved in an environment that handed it the date. A real
      # `pip install tooprolix` from the sdist — what a user on a platform outside the matrix gets —
      # has no such environment and no `.git`, so `build.rs` falls through to `unknown`.
      #
      # Measured, and ACCEPTED: `unknown` is what `build.rs` was designed to say when it cannot know
      # its provenance, in preference to borrowing a surrounding repository's date (the bug task #7
      # fixed). `--help` documents it to users. So the behaviour is pinned as an expectation instead
      # of being left as something the matrix quietly never exercises: `env -u SOURCE_DATE_EPOCH`
      # plus the literal expected date `unknown`. The day an offline sdist starts printing something
      # else — a wall clock, a borrowed commit — this step goes red.
      - name: install-smoke the sdist offline, where the date is honestly unknown
        run: env -u SOURCE_DATE_EPOCH scripts/install-smoke.sh "$SDIST" unknown

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-sdist
          path: |
            dist
            dist-from-sdist

      # THE BINARIES THIS JOB UPLOADS ARE WHAT ACTUALLY GETS PUBLISHED, so this job proves for
      # itself which commit it built. Change this workflow's checkout to `ref: main` and every leg
      # builds the wrong tree while every REST job still self-reports `head_sha=<tag>` — the tag-job
      # grader would accept it, because `head_sha` is a label the run attaches to itself.
      #
      # LAST, after the artifacts are built and smoked, so a second checkout inserted between the
      # checkout and the build cannot leave a correct-looking record of a tree nobody built. Same
      # step, same shell, as every job in `ci.yml`.
      - name: The gates above ran on the commit this event names
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "graded commit $sha, tree $(git rev-parse "HEAD^{tree}")"
          if [ "$sha" != "${GITHUB_SHA:-}" ]; then
            echo "FAIL: this job graded $sha, but the event names ${GITHUB_SHA:-<unset>}." >&2
            exit 1
          fi

  # THE THREE WHEEL LEGS RUN ON THE EVENTS THAT PRECEDE A TAG, NOT ON EVERY PULL REQUEST.
  #
  # Measured cost of running them everywhere, per PR: sdist 3 + linux 3 + macos 20 (the x10
  # private-repo multiplier) + windows 6 = 32 billed minutes, of which the three wheel legs are 29.
  # An ordinary PR keeps the `sdist` job, which is the leg that grades the README transform, the
  # archive contents and the offline-sdist behaviour — the checks a code change can actually break.
  #
  # A cross-platform break is still caught BEFORE the tag and before any publish, because the
  # release-plz PR runs the full matrix. The tag then runs it again on the tree that is really
  # released. Nothing is removed from the TAG matrix; each leg there is the only smoke test of the
  # operating system its wheel tag claims.
  #
  # THIS IS AN EVENT CONDITION, NOT A PATH ONE, and the distinction is the whole point. A path
  # filter would skip the wheels on a README-only change — precisely the change able to break the
  # transformer that rewrites the description PyPI renders. An event condition cannot be wrong about
  # which files matter, because it never asks.
  #
  # `github.head_ref` is set only on `pull_request`, and `startsWith` on the empty string is false,
  # so the release-plz clause cannot leak into a push event.
  #
  # CONSEQUENCE THAT MUST NOT BE FORGOTTEN WHEN BRANCH PROTECTION IS TURNED ON: these three legs are
  # now SKIPPED on an ordinary PR, and a skipped check does not satisfy a required status check — it
  # stays pending forever. `wheel linux-x86_64`, `wheel macos-arm64` and `wheel windows-x86_64` must
  # therefore never be registered as required checks. The required name is `CI / ci-required`, which
  # lives in `ci.yml` and carries no condition on any of its work jobs.
  wheels:
    name: wheel ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || startsWith(github.head_ref, 'release-plz-')
    strategy:
      # `fail-fast: false` so one red platform still leaves the other two measured. AC4's rule is
      # "an artifact that could not be smoked is excluded from the matrix", and deciding that needs
      # every platform's answer, not the first failure.
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            # The tag the wheel is REQUIRED to carry, checked against the file maturin produced.
            # "it built on the runner" is not a floor.
            expect_tag: py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
            expect_tag: py3-none-macosx_11_0_arm64
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
            expect_tag: py3-none-win_amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Export SOURCE_DATE_EPOCH from the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Rewrite the README for the PyPI project page
        shell: bash
        run: uv run --no-project --with 'readme_renderer[md]' python scripts/transform_readme.py README.md

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist --compatibility pypi
          # THE MANYLINUX WHEEL BUILDS INSIDE A DOCKER CONTAINER, AND THE JOB'S ENVIRONMENT DOES
          # NOT FOLLOW IT IN. Found by the smoke rather than by reading the action: run 30605047058
          # was green through `Build wheel`, the tag check and `twine check`, and then
          #
          #   FAIL: --version printed 'tooprolix 0.4.1 (unknown)'
          #
          # — the linux artifact did not know what commit it was built from, while the natively
          # built macOS wheel in the same run printed a real date. Without the version assertion in
          # `scripts/install-smoke.sh` this run would have uploaded that wheel as a pass. This is
          # ignored on the macOS and Windows legs, which use no container.
          docker-options: -e SOURCE_DATE_EPOCH
        env:
          # Declared rather than inherited — see the header. maturin already defaults to 11.0 here;
          # a default is not a promise, and this is the line that keeps the tag honest if it changes.
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      # The count comes FIRST, and it is not tidiness. `$(echo dist/*.whl)` is a space-joined
      # list, and `basename` on such a list silently answers with the last entry — so in run
      # 30604813542 a check reported PASS on a directory holding a foreign macOS wheel beside the
      # real one, and the failure only surfaced two steps later inside uv. A guard that grades
      # whatever the glob swept up is not grading the artifact.
      - name: Resolve the built wheel, exactly one
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2206
          built=(dist/*.whl)
          if [ "${#built[@]}" -ne 1 ] || [ ! -f "${built[0]}" ]; then
            echo "FAIL: expected exactly one wheel in dist/, found ${#built[@]}: ${built[*]}" >&2
            exit 1
          fi
          echo "WHEEL=${built[0]}" >> "$GITHUB_ENV"
          echo "built: ${built[0]}"

      - name: twine check
        shell: bash
        run: uvx twine check --strict "$WHEEL"

      # AC2 and AC3/AC8 in one committed gate — `scripts/check_artifact.py`, which the sdist job
      # runs too and which has its own tests.
      #
      # `expect_tag` is declared in the matrix above rather than derived here, so it is fixed
      # independently of whatever the build produced. The script requires BOTH the archive's
      # `.dist-info/WHEEL` and the filename to agree with it: the in-archive read is what a resolver
      # honours, the filename read is what catches a rename.
      #
      # It compares TAG SETS, not strings. `.dist-info/WHEEL` carries one `Tag:` line per tag
      # while the filename carries PEP 425's compressed set, and run 30613111390 went red on the
      # linux leg for exactly that difference in representation. macOS and Windows wheels are
      # single-tag, which is why only CI could find it.
      #
      # WHAT THIS DOES NOT CHECK, said plainly: no symbol versions are audited. Nothing opens the
      # ELF to compare its `GLIBC_*` requirements against the 2.17 the tag promises — **the
      # manylinux build container IS the whole guarantee** for that, being a sysroot old enough that
      # a newer symbol cannot be linked in the first place. If the linux leg ever stops going
      # through `manylinux: 2_17`, this keeps passing while the promise breaks, and `auditwheel`
      # becomes the missing step.
      - name: The wheel is the promised tag and carries MIT, its LICENSE, and the transformed README
        shell: bash
        run: |
          uv run --no-project python scripts/check_artifact.py "$WHEEL" README.md \
            --expect-tag "${{ matrix.platform.expect_tag }}"

      - name: install-smoke
        shell: bash
        run: scripts/install-smoke.sh "$WHEEL" "$(git log -1 --format=%cs)"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ matrix.platform.name }}
          path: dist

      - name: The gates above ran on the commit this event names
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "graded commit $sha, tree $(git rev-parse "HEAD^{tree}")"
          if [ "$sha" != "${GITHUB_SHA:-}" ]; then
            echo "FAIL: this job graded $sha, but the event names ${GITHUB_SHA:-<unset>}." >&2
            exit 1
          fi
