name: Release-plz

# Version bumps and CHANGELOG.md are generated from the Conventional Commits, never written by hand.
# All configuration lives in release-plz.toml, and that is also the ONE place registry publishing is
# switched off (`[workspace] publish = false`). It is deliberately NOT set in Cargo.toml, where the
# same key would disable release-plz altogether — Cargo.toml carries a comment explaining why.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Opens/updates the Release PR: bumps `[package] version` in Cargo.toml and rewrites CHANGELOG.md.
  release-pr:
    name: release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    # Never cancel a half-finished release PR — `cancel-in-progress: true` here could leave the
    # branch pushed but the PR unopened.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # WHERE THE STALE TAG IS BORN, AND THE ONE LINE THAT STOPS IT BEING BORN.
          #
          # By default this checks out `github.sha` — the SHA of the push that triggered the run.
          # This job's concurrency group has `cancel-in-progress: false`, so a run queued behind
          # another starts minutes later and still forks the release branch from that older tip.
          # Measured on `v0.4.6`: the release branch was created at `0e1b710` while `main` was
          # already `e9af7ed` (PR #48, merged 8 min 25 s before the tag), and the tag inherited the
          # stale tree. `ref: main` resolves the branch when the job actually runs.
          #
          # This is CONFIGURATION, not a guard: it removes the usual cause, it cannot refuse an
          # outcome. The `release` job below refuses the outcome. Both, deliberately.
          ref: main
          # release-plz reads every commit since the last tag to compute the bump; a shallow clone
          # gives it nothing to read.
          fetch-depth: 0
          persist-credentials: false

      # No toolchain-install step: rust-toolchain.toml pins 1.97.0 and rustup (preinstalled on the
      # runner) honours it the first time release-plz shells out to cargo.
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          # A fine-grained PAT, NOT the default secrets.GITHUB_TOKEN. Commits and PRs made with the
          # default token cannot trigger workflows, so the Release PR would never get the `lint`,
          # `type`, `test`, `cargo-*` checks that branch protection requires — leaving it
          # permanently unmergeable at "Expected — waiting for status to be reported".
          # It is a fine-grained PAT with Contents + Pull requests set to read/write, held as the
          # repository secret RELEASE_PLZ_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Tags and creates the GitHub release once the Release PR is merged. `release_always = false` in
  # release-plz.toml means an ordinary commit on main does nothing here.
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    # Tagging is not idempotent. Two pushes to main in quick succession after a Release PR merge would
    # otherwise run two `release` jobs at once, both eligible to create the same tag and GitHub
    # release; the loser fails on the existing tag and paints main red. `cancel-in-progress: false`
    # for the same reason as in release-pr — never interrupt a half-finished release.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # INVARIANT A: THE TREE ABOUT TO BE TAGGED MUST BE THE TREE THAT LANDED ON MAIN.
      #
      # Three of this repository's first five releases shipped a tree `main` never had. release-plz
      # PRs are merged with a MERGE COMMIT (task PRs are squashed), so the release commit keeps
      # whatever `main` tip release-plz forked from, and everything merged after that fork point is
      # simply absent from the tag. `v0.4.6` is missing PR #48 entirely — 6 files, +88/-83 — and
      # publication would have uploaded a binary built from a tree nothing on `main` ever tested.
      #
      #   tag     tag tree    merge tree   invariant A
      #   v0.4.2  b242d719    b242d719     TRUE
      #   v0.4.3  65a7ca70    db496fb3     FALSE
      #   v0.4.4  edfe3539    edfe3539     TRUE
      #   v0.4.5  68cdf923    cf8d4ea8     FALSE
      #   v0.4.6  5d0ceefb    3a1f67fd     FALSE
      #   v0.4.7  1c89006c    1c89006c     TRUE
      #
      # It is NOT an ancestry claim. With a merge-commit release the tag target is an ancestor of
      # `main` on every release, good and bad alike — measured both directions on `v0.4.6`.
      #
      # WHAT IT COMPARES. This job runs on the push of the merge commit, so HEAD is that merge and
      # `HEAD^2` is the release commit release-plz tags — verified against all six tags: each one's
      # target is exactly its merge commit's second parent. A merge is only clean when those two
      # trees are identical. When HEAD is not a merge at all there is no second candidate: the only
      # commit that can be tagged IS HEAD, so the invariant holds by construction rather than by
      # assumption, and that branch is stated out loud rather than left as a silent pass.
      #
      # IT MUST REFUSE RELEASES, NOT REFUSE MERGES. An ORDINARY merge-commit PR forks at A, `main`
      # advances to B, and the PR lands as merge M: `M^{tree}` holds both changes and `M^2^{tree}`
      # lacks B, so the trees differ — and `release_always = false` means release-plz would tag
      # nothing at all. Comparing unconditionally would paint `main` red for a merge that is not a
      # release. So the release commit is IDENTIFIED first, on two independent signals, and both
      # were measured over every merge commit this repository has:
      #
      #   * `HEAD^2`'s subject is `chore: release …` — true for all TWELVE releases (v0.3.5..v0.4.7);
      #   * the merge's own subject names a `release-plz-…` branch — true for the ten that GitHub
      #     merged rather than squashed.
      #
      # The one non-release merge on `main` (`68ab88f`, PR #19) matches NEITHER. The residual is
      # named rather than hidden: a release whose commit subject template changed AND that was
      # merged without `release-plz-` in the merge subject would skip the comparison. Both signals
      # would have to change together, and `test_a_non_release_merge_does_not_redden_main` plus the
      # six historical releases pin the behaviour in both directions.
      #
      # IT RUNS BEFORE THE TAGGING ACTION, because afterwards there is nothing left to refuse: a tag
      # is not a proposal, and deleting a published one is not a CI problem any more.
      #
      # AND IT FAILS CLOSED. The first version of this verifier ignored git's exit status, so two
      # unresolvable refs produced two empty strings, compared EQUAL, and printed `OK` — certifying
      # objects that do not exist. `set -e` plus `--verify` plus the emptiness check is why it now
      # exits non-zero when it cannot resolve what it is grading. Exercised by
      # `tests/unit/test_workflow_contracts.py`, which executes THIS shell against all six releases
      # and against a directory that is not a repository.
      - name: Refuse to tag a tree that is not main's
        run: |
          set -euo pipefail

          head=$(git rev-parse --verify "HEAD^{commit}")
          head_tree=$(git rev-parse --verify "HEAD^{tree}")
          if [ -z "$head" ] || [ -z "$head_tree" ]; then
            echo "FAIL: unresolved input (main commit '$head', main tree '$head_tree')." >&2
            exit 1
          fi

          if ! release=$(git rev-parse --verify --quiet "HEAD^2"); then
            echo "OK: HEAD is not a merge commit, so the only commit release-plz can tag is HEAD."
            exit 0
          fi

          release_subject=$(git log -1 --format=%s "$release")
          merge_subject=$(git log -1 --format=%s "$head")
          is_release=no
          case "$release_subject" in "chore: release "*) is_release=yes ;; esac
          case "$merge_subject" in *"release-plz-"*) is_release=yes ;; esac
          if [ "$is_release" != "yes" ]; then
            echo "OK: HEAD^2 is '$release_subject', which is not a release-plz release commit."
            echo "    release_always = false, so this push creates no tag and there is no tree to guard."
            exit 0
          fi

          release_tree=$(git rev-parse --verify "$release^{tree}")
          if [ -z "$release_tree" ]; then
            echo "FAIL: unresolved input (release tree of $release is empty)." >&2
            exit 1
          fi

          echo "main            $head ($head_tree)"
          echo "to be tagged    $release ($release_tree)"

          if [ "$release_tree" != "$head_tree" ]; then
            echo "FAIL: $release would be tagged with tree $release_tree, but main carries $head_tree." >&2
            echo "      Everything merged after the release branch forked is missing from the tag:" >&2
            git diff --stat "$release" "$head" >&2
            exit 1
          fi

          echo "OK: the commit release-plz will tag carries main's tree."

      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Deliberately NO CARGO_REGISTRY_TOKEN: nothing is published to crates.io until
          # `package-python-distribution-and-publish-0-1-0`. What actually enforces that is
          # `[workspace] publish = false` in release-plz.toml — the single switch. Omitting the token
          # is only a backstop.
